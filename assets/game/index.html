<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kayıp Eşya Bürosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sevimli, sıcak, kasaba masalı
   IDEA: istasyon karşısındaki küçük kayıp eşya bürosu, gerçek 3D bir oda olarak
   PICTURE: tüm ekran Three.js sahnesi; eşyaya dokununca yeşil matlı çalışma masasında döndürülebilen 3D eşya
   COLOUR and TYPE: adaçayı duvar kâğıdı, ceviz ahşap, pirinç, domates kırmızısı vurgu; Fredoka
   LAYOUT: telefon gibi dikey sahne; HUD üstte, konuşma balonu sağda, not kâğıdı altta */
:root{color-scheme:light dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(circle at 50% 30%,#4a3426,#1e1612 70%);font:16px/1.4 Fredoka,system-ui,sans-serif;color:#2e2520;display:grid;place-items:center;min-height:100vh;min-height:100dvh;overflow:hidden;overscroll-behavior:none}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;container-type:inline-size;overflow:hidden;font-size:clamp(13px,3.4cqw,19px);user-select:none;-webkit-user-select:none;background:#2a1f1a}
@media(min-aspect-ratio:5/7){.stage{width:calc(100vh*5/7);width:calc(100dvh*5/7)}}
@media(min-aspect-ratio:5/7) and (min-width:700px){.stage{height:calc(100dvh - 32px);width:calc((100dvh - 32px)*5/7);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage.inbench .hud,.stage.inbench .note,.stage.inbench .bubble{display:none}
.hud{position:absolute;top:max(1.8%,env(safe-area-inset-top));right:3%;display:flex;gap:.4em;flex-wrap:wrap;justify-content:flex-end}
.chip.combo{background:#ffe9a8}
.clabel{position:absolute;transform:translate(-50%,-50%);background:#2f3b33;color:#f3ead2;border:2px solid #8d5a33;border-radius:.5em;padding:0 .5em;font-size:max(13px,2.4cqw);font-weight:600;white-space:nowrap;pointer-events:none;line-height:1.5}
.clabel span{opacity:.75;font-weight:500}
.clabel.lock{background:#4a4540;color:#c9c0b4}
.stage.inbench .clabel{display:none}
.chip{background:#fff8ea;border-radius:99px;padding:.2em .8em;font-weight:600;box-shadow:0 3px 0 #c9a87f;white-space:nowrap}
.chip svg{width:1em;height:1em;vertical-align:-.13em;margin-right:.3em}
.chip.late,.task.late{background:#ffd9cf;color:#a3341f}
.bubble{position:absolute;top:9%;left:50%;right:2.5%;background:#fffaf0;border-radius:1em;padding:.55em .8em;box-shadow:0 5px 0 rgba(0,0,0,.18);animation:pop .35s ease}
.bubble[hidden]{display:none}
.bubble{pointer-events:none}
.stage.inpeek .hud,.stage.inpeek .note,.stage.inpeek .clabel{display:none}
.peek{position:absolute;left:4%;right:4%;bottom:max(3%,env(safe-area-inset-bottom));z-index:5;background:#fbf5e6;border-radius:1em;padding:.7em 1em;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.peek[hidden]{display:none}
.peek p{margin:0 0 .5em;color:#4b3c32}
.bubble::after{content:"";position:absolute;bottom:-.7em;left:42%;border:.5em solid transparent;border-top:.8em solid #fffaf0;border-bottom:0}
.bubble b{display:block;color:#2f7d63;font-size:.85em;font-weight:600}
.bubble p{margin:.1em 0 0}
.pat{height:.45em;background:#eadfca;border-radius:1em;overflow:hidden;margin:.25em 0 .15em}
.pat i{display:block;height:100%;width:100%;background:#5fb36b;transition:width .2s linear,background .3s}
.pl{display:inline-flex;align-items:center;gap:.15em;background:#f1e5c9;border-radius:.4em;padding:0 .3em;white-space:nowrap}
.pl svg{width:1.25em;height:1.25em}
.note{position:absolute;left:4%;right:4%;bottom:max(2.2%,env(safe-area-inset-bottom));min-height:19%;background:#fbf5e6;border-radius:.5em;padding:.55em .9em;box-shadow:0 6px 14px rgba(0,0,0,.35);transform:rotate(-.5deg);display:flex;flex-direction:column;justify-content:space-between;gap:.35em}
.note::before{content:"";position:absolute;top:-.55em;left:50%;width:5em;height:1.1em;background:rgba(240,220,170,.85);transform:translateX(-50%) rotate(2deg)}
.note p{margin:0;color:#4b3c32}.note b{color:#2e2520}
.row{display:flex;gap:.5em;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:.8em;min-height:44px;padding:.3em 1em;cursor:pointer;background:#fff;color:#2e2520;box-shadow:0 3px 0 #cdb894;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
.main{background:#e2543a;color:#fff;box-shadow:0 3px 0 #a3341f;font-weight:600}
.ad{background:#ffe9a8;box-shadow:0 3px 0 #d9b75a}
.ad::before{content:"▶";color:#e2543a;font-size:.8em;margin-right:.4em}
button:focus-visible{outline:3px solid #2f7d63;outline-offset:2px}
.bench{position:absolute;inset:0;z-index:5;pointer-events:none}
.bench[hidden]{display:none}
.bench>*{pointer-events:auto}
.btop{position:absolute;top:max(2%,env(safe-area-inset-top));left:3%;right:3%;display:flex;justify-content:space-between;gap:.5em;align-items:flex-start}
.tasks{display:flex;flex-wrap:wrap;gap:.35em}
.task{background:rgba(255,250,240,.94);border-radius:99px;padding:.15em .7em;font-weight:500;white-space:nowrap}
.task.ok{background:#bfe6c9;color:#1f5a3a}
.task.warn{background:#ffe9a8}
.bbot{position:absolute;left:3%;right:3%;bottom:max(2%,env(safe-area-inset-bottom));display:grid;gap:.45em}
.bmsg{background:#fbf5e6;border-radius:.6em;padding:.4em .8em;margin:0;min-height:2.9em;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.35em;background:var(--tb,#6e4426);padding:.45em;border-radius:.8em;box-shadow:inset 0 4px 0 var(--tbs,#57341c)}
.tool{display:flex;flex-direction:column;align-items:center;background:var(--tt,#8e5c37);color:#fff4e2;box-shadow:0 3px 0 var(--tts,#4e2f19);padding:.25em .1em;font-size:max(13px,.78em);transition:transform .12s}
.tool svg{width:100%;height:2.3em}
@media(max-width:480px){.tools{grid-template-columns:repeat(3,minmax(0,1fr))}.tool{flex-direction:row;justify-content:center;gap:.3em;min-height:44px}.tool svg{width:1.9em;height:1.9em}.tools.many{grid-template-columns:repeat(4,minmax(0,1fr))}.tools.many .tool{flex-direction:column;gap:0;font-size:12px;padding:.2em 0}.tools.many .tool svg{width:100%;height:1.6em}}
.pal{justify-content:center}.pal[hidden]{display:none}
.sw{display:inline-flex;align-items:center;gap:.4em;padding:.2em .8em .2em .4em}.sw i{width:1.6em;height:1.6em;border-radius:50%;border:2px solid rgba(0,0,0,.2)}.sw svg{width:1.8em;height:1.8em}.sw.on{outline:3px solid #2f7d63;outline-offset:1px;background:#eaf6ee}
.tabs{display:flex;gap:.35em;margin:.5em 0 .2em}.tabs button{flex:1;padding:.3em .4em}.tabs button.on{background:#2f7d63;color:#fff;box-shadow:0 3px 0 #1f5a3a}
.pips{font-style:normal;color:#e2a23c;letter-spacing:.1em;font-size:.85em}
.swc{display:inline-block;width:1.1em;height:1.1em;border-radius:.3em;vertical-align:-.15em;margin-right:.45em;border:2px solid rgba(0,0,0,.15)}
.mcard h3{margin:.6em 0 0;font-size:1em;color:#2f7d63}
.tool.on{background:#f6e2b8;color:#2e2520;transform:translateY(-4px)}
.rots{position:absolute;right:3%;top:30%;display:grid;gap:.5em}
.rots button{width:3em;height:3em;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(251,245,230,.95)}
.rots svg{width:1.6em;height:1.6em}
#cur{position:absolute;width:24cqw;height:24cqw;pointer-events:none;z-index:6;display:none}
#cur svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
#ring{position:absolute;width:22cqw;height:22cqw;border-radius:50%;pointer-events:none;z-index:6;transform:translate(-50%,-50%);background:conic-gradient(#ffe07a calc(var(--k,0)*1turn),rgba(255,255,255,.25) 0);-webkit-mask:radial-gradient(circle,transparent 57%,#000 60%);mask:radial-gradient(circle,transparent 57%,#000 60%)}
#ring[hidden]{display:none}
.dot{position:absolute;width:2.2cqw;height:2.2cqw;border-radius:50%;background:#cbb89c;pointer-events:none;z-index:6;animation:puff .6s ease-out forwards}
.spk{position:absolute;width:9cqw;height:9cqw;z-index:6;pointer-events:none;animation:spark 1.1s ease-out forwards}
.modal{position:absolute;inset:0;z-index:8;background:rgba(20,12,8,.55);display:grid;place-items:center;padding:5%}
.modal[hidden]{display:none}
.mcard{background:#fbf5e6;border-radius:1em;padding:1.1em 1.3em;width:100%;max-height:94%;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mcard h2{margin:0 0 .3em;font-size:1.5em;line-height:1.1}
.mcard p,.mcard li{color:#5b4a3e;margin:.3em 0}
.mcard ol{padding-left:1.2em;margin:.4em 0}
.legend{display:flex;flex-wrap:wrap;gap:.4em;margin:.5em 0}
.sum{display:grid;grid-template-columns:1fr auto;gap:.2em 1em;margin:.6em 0}
.sum b{text-align:right}
.bar{height:.6em;background:#e9dcc3;border-radius:1em;overflow:hidden;margin:.6em 0}
.bar b{display:block;height:100%;width:0;background:#2f7d63}
.shop{display:grid;gap:.4em;margin:.6em 0}
.shop>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6em;align-items:center;background:#fff;border-radius:.6em;padding:.3em .3em .3em .7em}
.shop small{display:block;color:#7a6656}
#toast{position:absolute;left:50%;top:70%;transform:translate(-50%,10px);background:#2e2520;color:#fbf5e6;padding:.45em 1em;border-radius:.8em;opacity:0;transition:.25s;pointer-events:none;z-index:9;width:max-content;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10%;color:#fbf5e6;background:#2a1f1a;z-index:10}
.hud2{position:absolute;top:calc(max(1.8%,env(safe-area-inset-top)) + 2.4em);left:3%;display:flex;gap:.4em;z-index:2}
.stage.inbench .hud2,.stage.inpeek .hud2{display:none}
.hbtn{min-height:0;height:2.2em;padding:0 .7em;border-radius:99px;background:#fff8ea;box-shadow:0 3px 0 #c9a87f;font-weight:600;display:inline-flex;align-items:center;gap:.3em}
.hbtn svg{width:1.15em;height:1.15em}.hbtn.alldone{background:#bfe6c9}
.hardtag{font-size:.5em;background:#e2543a;color:#fff;border-radius:99px;padding:.1em .6em;vertical-align:middle}
.qs{margin:.2em 0;padding-left:1.2em}.qs li{margin:.15em 0}
.qlist{display:grid;gap:.4em;margin:.5em 0}.qlist>div{background:#fff;border-radius:.6em;padding:.4em .7em;display:grid;grid-template-columns:1fr auto;gap:0 .5em}.qlist .bar{grid-column:1/-1;margin:.3em 0 .1em}.qlist .ok{background:#e4f4e8}.qlist .ok span{color:#1f5a3a;font-weight:600}
.albw{max-height:60vh;max-height:60dvh;overflow:auto;margin:.4em 0}
.alb{display:grid;gap:.3em}.alb>div{display:flex;justify-content:space-between;align-items:center;gap:.5em;background:#fff;border-radius:.5em;padding:.25em .6em}.alb .no span:first-child{color:#b3a08a}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}.dots i{width:.75em;height:.75em;border-radius:50%;border:1.5px solid #d8c9ad;display:block}
.mcard h3 small.ok{color:#fff;background:#2f7d63;border-radius:99px;padding:0 .5em;font-size:.75em}
.fr{display:grid;grid-template-columns:auto 1fr auto;gap:.6em;align-items:center;background:#fff;border-radius:.6em;padding:.4em .6em;margin:.3em 0}.fr small{display:block;color:#7a6656}
.face{width:2em;height:2em;border-radius:50%;border:3px solid;display:block}.hearts{color:#e2543a;font-size:1.1em;letter-spacing:.05em;white-space:nowrap}
.streak{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25em;margin:.6em 0}.streak>div{background:#fff;border-radius:.5em;padding:.3em .15em;text-align:center;font-size:.75em;line-height:1.15;color:#7a6656}.streak b{display:block;font-size:1.3em;color:#2e2520}
.streak .got{background:#e4f4e8}.streak .now{background:#ffe9a8;outline:3px solid #e2a23c;color:#2e2520}
.cele{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:2.2em;font-weight:700;color:#fff;text-shadow:0 3px 0 #a3341f,0 0 18px rgba(0,0,0,.35);z-index:7;pointer-events:none;white-space:nowrap;animation:cele 1.7s ease forwards}
.conf{position:absolute;width:1.6cqw;height:2.6cqw;border-radius:2px;z-index:6;pointer-events:none;animation:conf 1.2s ease-out forwards}
@keyframes cele{0%{transform:translateX(-50%) scale(.3);opacity:0}15%{transform:translateX(-50%) scale(1.15);opacity:1}25%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{transform:translateX(-50%) translateY(-30px);opacity:0}}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes puff{to{transform:translate(var(--dx),var(--dy)) scale(1.8);opacity:0}}
@keyframes spark{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.2) rotate(30deg)}100%{transform:scale(1) rotate(45deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="cv" aria-label="Kayıp eşya bürosu, üç boyutlu sahne"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="metal" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#c9ccd4"/><stop offset="1" stop-color="#7c808c"/></radialGradient></defs></svg>
<div class="hud"><span class="chip" id="cClock" aria-label="Saat"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#fff" stroke="#6e4426" stroke-width="2"/><path d="M10 5v5l3 2" stroke="#6e4426" stroke-width="2" fill="none" stroke-linecap="round"/></svg><b id="sTime">08:00</b></span><span class="chip" aria-label="Altın"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#f2c14e" stroke="#c9962a" stroke-width="2"/><circle cx="10" cy="10" r="4" fill="none" stroke="#c9962a" stroke-width="1.5"/></svg><b id="sCoin">0</b></span><span class="chip combo" id="cCombo" hidden aria-label="Seri çarpanı">Seri <b>×1.0</b></span><span class="chip" aria-label="İtibar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l2.6 5.6 6 .7-4.5 4.1 1.2 6L10 15l-5.3 2.9 1.2-6L1.4 7.8l6-.7z" fill="#e2543a"/></svg><b id="sRep">3</b>/5</span></div>
<div class="hud2"><button class="hbtn" id="bAlb" aria-label="Albüm"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6q1 0 1 1v13q0-1-1-1H3z" fill="#e2543a"/><path d="M17 3h-6q-1 0-1 1v13q0-1 1-1h6z" fill="#4d8fd6"/></svg>Albüm</button><button class="hbtn" id="cQuest" aria-label="Görevler"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="2" width="14" height="16" rx="2" fill="#f2c14e"/><path d="M6 7h8M6 10h8M6 13h5" stroke="#6e4426" stroke-width="1.6" stroke-linecap="round"/></svg><b id="qN">0/0</b></button><button class="hbtn" id="bSnd" aria-label="Ses"></button></div>
<div class="bubble" id="bubble" hidden aria-live="polite"><b id="cname"></b><div class="pat" aria-label="Müşterinin sabrı"><i id="patb"></i></div><p id="ctext"></p></div>
<div class="note" aria-live="polite"><p id="ntext">Büro hazırlanıyor…</p><div class="row" id="nbtn"></div></div>
<div class="bench" id="bench" hidden>
 <div class="btop"><div class="tasks" id="tasks"></div><button id="bclose">Kapat</button></div>
 <div class="rots" role="group" aria-label="Eşyayı çevir"><button id="rL" aria-label="Sola çevir"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2" fill="none" stroke="#2e2520" stroke-width="2.5" stroke-linecap="round"/><path d="M3 3v5h5" fill="none" stroke="#2e2520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="rR" aria-label="Sağa çevir"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2" fill="none" stroke="#2e2520" stroke-width="2.5" stroke-linecap="round"/><path d="M21 3v5h-5" fill="none" stroke="#2e2520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="rT" aria-label="Üstten ya da yandan bak"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5" fill="none" stroke="#2e2520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
 <div class="bbot"><p class="bmsg" id="bmsg"></p><div class="row pal" id="pal" hidden role="group" aria-label="Seçenekler"></div><div class="row" id="bads"></div><div class="tools" id="tools" role="toolbar" aria-label="Aletler"></div></div>
</div>
<div class="peek" id="peek" hidden><p><b>Bu eşya mı?</b> Parmağınla çevirip her yanına bak. <span id="pkTag"></span></p><div class="row"><button class="main" id="pkGive">Bunu ver</button><button id="pkBack">Geri koy</button></div></div>
<div id="cur"></div><div id="ring" hidden></div>
<div class="modal" id="modal" hidden><div class="mcard" id="mcard"></div></div>
<div id="toast"></div>
<div class="loading" id="loading">Büro hazırlanıyor…</div>
</div>
